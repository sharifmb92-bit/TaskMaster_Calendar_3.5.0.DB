<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente Oscuro -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23130d" />
      <stop offset="100%" stop-color="#140a06" />
    </linearGradient>

    <!-- Gradiente de Acento Warm/Cafe -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5934a" />
      <stop offset="100%" stop-color="#c4732e" />
    </linearGradient>

    <!-- Sombra Suave -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fondo Base Adaptable con Margen de Seguridad para Maskable Icon -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)" />

  <!-- Símbolo Principal: Calendario & Tareas TaskMaster Pro -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Marco del Calendario -->
    <rect x="116" y="126" width="280" height="260" rx="24" fill="#2d1a12" stroke="url(#accent-grad)" stroke-width="8" />
    
    <!-- Cabecera del Calendario -->
    <path d="M 116 150 C 116 136, 126 126, 140 126 L 372 126 C 386 126, 396 136, 396 150 L 396 190 L 116 190 Z" fill="url(#accent-grad)" />
    
    <!-- Anillas del Calendario -->
    <rect x="176" y="96" width="16" height="40" rx="8" fill="#e5934a" />
    <rect x="320" y="96" width="16" height="40" rx="8" fill="#e5934a" />

    <!-- Elementos Internos: Tareas / Checklist -->
    <circle cx="176" cy="240" r="14" fill="#6bb05d" />
    <path d="M 170 240 L 174 244 L 182 234" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="210" y="232" width="140" height="16" rx="8" fill="#e0d0c8" opacity="0.9" />

    <circle cx="176" cy="290" r="14" fill="#38bdf8" />
    <path d="M 170 290 L 174 294 L 182 284" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="210" y="282" width="110" height="16" rx="8" fill="#e0d0c8" opacity="0.9" />

    <circle cx="176" cy="340" r="14" fill="#e54d42" />
    <rect x="210" y="332" width="80" height="16" rx="8" fill="#e0d0c8" opacity="0.6" />
  </g>

  <!-- EMBLEMA HEXAGONAL OFICIAL medbasha EN ESQUINA INFERIOR -->
  <g transform="translate(256, 440)">
    <!-- Hexágono Base -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#140a06" stroke="#e5934a" stroke-width="2.5" />
    <!-- Iniciales mb -->
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#e0d0c8" text-anchor="middle">mb</text>
    <!-- Firma medbasha -->
    <text x="32" y="4" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#a0887e" text-anchor="start" letter-spacing="1">medbasha</text>
  </g>
</svg>
